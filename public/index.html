<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XCY Image Host</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b0d10;color:#f4f6f8;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(680px,100%);background:#12161b;border:1px solid #252c34;border-radius:20px;padding:24px;box-shadow:0 18px 60px #0008}h1{margin:0 0 8px;font-size:28px}.sub{color:#9aa5b1;margin:0 0 22px}.drop{border:2px dashed #39434e;border-radius:16px;padding:34px 18px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:#8c9aa8;background:#171c22}input{display:none}.btn{display:inline-block;background:#f4f6f8;color:#0b0d10;padding:11px 18px;border-radius:11px;font-weight:700}#status{margin-top:18px;white-space:pre-wrap;color:#c8d0d8;line-height:1.5}.progress{height:8px;background:#252c34;border-radius:99px;overflow:hidden;margin-top:14px;display:none}.bar{height:100%;width:0;background:#f4f6f8;transition:width .15s}.result{display:none;margin-top:18px;background:#0d1116;border:1px solid #252c34;border-radius:13px;padding:14px}.result a{color:#fff;word-break:break-all}.copy{margin-top:10px;border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}.note{font-size:12px;color:#7f8b98;margin-top:15px}code{background:#1b2128;padding:2px 5px;border-radius:5px}
</style>
</head>
<body>
<main class="card">
  <h1>🐾 XCY Image Host</h1>
  <p class="sub">Upload gambar sampai <b>100 MB</b> dan dapat URL <code>.xcy</code>.</p>
  <label class="drop" id="drop">
    <input id="file" type="file" accept="image/*">
    <div style="font-size:42px">☁️</div>
    <p><b>Pilih gambar</b> atau drag & drop di sini</p>
    <span class="btn">Pilih File</span>
  </label>
  <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
  <div id="status"></div>
  <div class="result" id="result">
    <div><b>URL gambar:</b></div>
    <a id="url" target="_blank" rel="noopener"></a>
    <br><button class="copy" id="copy">Salin URL</button>
  </div>
  <div class="note">100 MB/file. File diteruskan secara streaming ke Catbox; tidak disimpan di Cloudflare R2.</div>
</main>
<script>
const fileInput=document.getElementById('file'),drop=document.getElementById('drop');
const statusEl=document.getElementById('status'),progress=document.getElementById('progress'),bar=document.getElementById('bar');
const result=document.getElementById('result'),urlEl=document.getElementById('url');
const MAX=100*1024*1024;
function upload(file){
  result.style.display='none';statusEl.textContent='';
  if(!file.type.startsWith('image/')){statusEl.textContent='❌ File harus berupa gambar.';return}
  if(file.size>MAX){statusEl.textContent='❌ Maksimal 100 MB per file.';return}
  progress.style.display='block';bar.style.width='0%';
  statusEl.textContent='⏳ Mengupload '+(file.size/1048576).toFixed(2)+' MB...';
  const xhr=new XMLHttpRequest();
  xhr.open('POST','/api/upload');
  xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');
  xhr.upload.onprogress=e=>{if(e.lengthComputable){bar.style.width=(e.loaded/e.total*100).toFixed(1)+'%';}};
  xhr.onload=()=>{
    try{const data=JSON.parse(xhr.responseText);if(xhr.status>=200&&xhr.status<300&&data.url){bar.style.width='100%';statusEl.textContent='✅ Upload berhasil!';urlEl.textContent=data.url;urlEl.href=data.url;result.style.display='block';}else{statusEl.textContent='❌ '+(data.error||'Upload gagal.')+(data.detail?'\n'+data.detail:'');}}
    catch{statusEl.textContent='❌ Server mengembalikan respons yang tidak valid.'}
  };
  xhr.onerror=()=>statusEl.textContent='❌ Koneksi upload gagal.';
  xhr.onabort=()=>statusEl.textContent='⚠️ Upload dibatalkan.';
  xhr.send(file);
}
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0])});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])upload(fileInput.files[0])});
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(urlEl.textContent);document.getElementById('copy').textContent='Tersalin ✓';setTimeout(()=>document.getElementById('copy').textContent='Salin URL',1200)}catch{}};
</script>
</body>
</html>
